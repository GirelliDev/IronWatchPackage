name: IronWatch Project Sync

on:
  issues:
    types:
      - opened
      - edited
      - closed
      - reopened

  schedule:
    - cron: '*/5 * * * *'

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      repository-projects: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r scripts/sync/requirements.txt

      - name: Run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ORG: CorelabsBR
          GITHUB_REPO: CorelabsBR/CL_IronWatchPackage
          GITHUB_PROJECT_NUMBER: 4
          PROJECT_STATUS_FIELD: Status
          PROJECT_TODO: A Fazer
          PROJECT_IN_PROGRESS: Em andamento
          PROJECT_DONE: Concluído

        run: python scripts/sync/sync.py
