name: IronWatch Mailer

on:
  schedule:
    - cron: '15 16 * * 1-5'
    - cron: '15 20 * * 1-5'
  workflow_dispatch:

jobs:
  mailer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r scripts/mailer/requirements.txt

      - name: Morning
        if: github.event.schedule == '15 16 * * 1-5'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO_PROFESSOR: ${{ secrets.MAIL_TO_PROFESSOR }}

        run: python scripts/mailer/mailer.py morning

      - name: Evening
        if: github.event.schedule == '15 20 * * 1-5'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO_PROFESSOR: ${{ secrets.MAIL_TO_PROFESSOR }}

        run: python scripts/mailer/mailer.py evening
